
name: Build Chinese Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Apply Chinese patch
        shell: pwsh
        run: |
          git apply --check zhCN-fixed2.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-fixed2.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --check zhCN-extra.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-extra.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --check zhCN-round3.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-round3.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --check zhCN-round4.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-round4.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --check zhCN-round5.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-round5.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --check zhCN-round5-fix.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-round5-fix.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply --check zhCN-round6.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git apply zhCN-round6.patch
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Web UI
        shell: pwsh
        working-directory: web_ui
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Windows application
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Front-Porch-AI-zhCN-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
